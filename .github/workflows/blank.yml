
name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '**.rst'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.rst'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - runs-on: windows-latest
            architecture: x86_64
            shell: msys2

    runs-on: ${{ matrix.os.runs-on }}

    defaults:
      run:
        shell: msys2 {0}

    timeout-minutes: 340

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: 7dog123/ps2dev

      - name: Install MSYS2 packages
        if: startsWith(matrix.os.runs-on, 'windows')
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel git make texinfo flex bison patch binutils
            mpc-devel tar wget curl autotools gettext gettext-devel
            mingw-w64-ucrt-x86_64-readline
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-libogg
            mingw-w64-ucrt-x86_64-libsystre
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Find pkg-config
        run: |
          which pkg-config
          pkg-config --version
          echo "PKG_CONFIG=$(which pkg-config)"
