name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    
    defaults:
      run:
       shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ps2dev/ps2dev

      - name: Install MSYS2 Packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: |
            base-devel git make texinfo flex bison patch binutils mingw-w64-x86_64-gcc mpc-devel tar
            autotools gettext gettext-devel
            mingw-w64-x86_64-cmake mingw-w64-x86_64-make mingw-w64-x86_64-libogg
          update: true

      - name: Run all stages in the shell
        run: |
          export PS2DEV=/c/PS2DEV
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin
          ./build-all.sh

      - name: Compress ps2dev folder
        run: |
          tar -zcvf ps2dev-mingw64.tar.gz /c/PS2DEV

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps2dev-mingw64
          path: ps2dev-mingw64.tar.gz
